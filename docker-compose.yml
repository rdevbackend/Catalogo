version: '3.8'

services:
  api-rap-doces:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rap_doces_api
    ports:
      - "8080:80"
      - "8081:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    volumes:
      # Mapeia a pasta de dados para persistir o SQLite na sua máquina
      - ./data:/app/data
    restart: always