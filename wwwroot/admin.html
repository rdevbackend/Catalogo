<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Gestão - Rap Doces</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    :root {
      --cor-principal: #d63384;
      --cor-secundaria: #6c757d;
      --cor-fundo: #fffafb;
      --cor-card: #ffffff;
    }

    body {
      background-color: var(--cor-fundo);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
    }

    .navbar-brand-custom {
      font-weight: 700;
      color: var(--cor-principal) !important;
      font-size: 1.5rem;
    }

    .card-custom {
      border: none;
      border-radius: 15px;
      background: var(--cor-card);
      box-shadow: 0 4px 15px rgba(214, 51, 132, 0.08);
      transition: transform 0.2s;
    }

    .card-faturamento {
      border-left: 5px solid var(--cor-principal);
    }

    .btn-custom {
      background-color: var(--cor-principal);
      color: white;
      border-radius: 20px;
      padding: 8px 20px;
      font-weight: 600;
      border: none;
    }

    .btn-custom:hover {
      background-color: #b8256f;
      color: white;
    }

    .table-custom {
      border-radius: 12px;
      overflow: hidden;
      background: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    .table-custom thead {
      background-color: #fce4ec;
      color: #880e4f;
    }

    .badge-status {
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .custom-select-sm {
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>

  <!-- Cabecalho -->
  <nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
      <span class="navbar-brand-custom">
        <i class="bi bi-shop mr-2"></i>Rap Doces - Painel de Gestão
      </span>
      <div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill mr-2">Ver Catálogo</a>
        <button class="btn btn-custom btn-sm" onclick="carregarTudo()">
          <i class="bi bi-arrow-clockwise"></i> Atualizar
        </button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    
    <!-- Cards de Faturamento -->
    <div class="row mb-4">
      <div class="col-md-4 mb-3">
        <div class="card card-custom card-faturamento p-3">
          <span class="text-muted small font-weight-bold text-uppercase">Faturamento da Semana</span>
          <h3 class="font-weight-bold text-dark mt-2 mb-0" id="valSemana">R$ 0,00</h3>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card card-custom card-faturamento p-3" style="border-left-color: #28a745;">
          <span class="text-muted small font-weight-bold text-uppercase">Faturamento do Mês</span>
          <h3 class="font-weight-bold text-dark mt-2 mb-0" id="valMes">R$ 0,00</h3>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card card-custom card-faturamento p-3" style="border-left-color: #17a2b8;">
          <span class="text-muted small font-weight-bold text-uppercase">Faturamento do Ano</span>
          <h3 class="font-weight-bold text-dark mt-2 mb-0" id="valAno">R$ 0,00</h3>
        </div>
      </div>
    </div>

    <!-- Tabela de Pedidos -->
    <div class="card card-custom">
      <div class="card-header bg-white font-weight-bold border-0 pt-3 pb-0" style="font-size: 1.2rem; color: #880e4f;">
        <i class="bi bi-receipt mr-2"></i>Pedidos Recebidos
      </div>
      <div class="card-body p-3">
        <div class="table-responsive">
          <table class="table table-hover table-custom mb-0">
            <thead>
              <tr>
                <th>Código</th>
                <th>Cliente / Telefone</th>
                <th>Total</th>
                <th>Status Pagamento</th>
                <th>Status Pedido</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaPedidos">
              <!-- Preenchido via JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api/pedido';

    async function carregarFaturamento() {
      try {
        const res = await fetch(`${API_URL}/faturamento`);
        if(!res.ok) return;
        const data = await res.json();
        document.getElementById('valSemana').innerText = `R$ ${data.totalSemana.toFixed(2).replace('.', ',')}`;
        document.getElementById('valMes').innerText = `R$ ${data.totalMes.toFixed(2).replace('.', ',')}`;
        document.getElementById('valAno').innerText = `R$ ${data.totalAno.toFixed(2).replace('.', ',')}`;
      } catch (err) {
        console.error("Erro ao carregar faturamento:", err);
      }
    }

    async function carregarPedidos() {
      try {
        const res = await fetch(`${API_URL}/todos`);
        if(!res.ok) return;
        const pedidos = await res.json();
        
        const tbody = document.getElementById('tabelaPedidos');
        tbody.innerHTML = '';

        if(pedidos.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Nenhum pedido cadastrado ainda.</td></tr>`;
          return;
        }

        pedidos.forEach(p => {
          tbody.innerHTML += `
            <tr>
              <td><strong class="text-primary">#${p.pedidoCodigo || p.id}</strong></td>
              <td>
                <span class="font-weight-bold">${p.clienteNome}</span><br>
                <small class="text-muted"><i class="bi bi-telephone"></i> ${p.clienteTelefone}</small>
              </td>
              <td class="font-weight-bold">R$ ${(p.valorTotal || 0).toFixed(2).replace('.', ',')}</td>
              <td>
                <select class="custom-select custom-select-sm" onchange="atualizarStatus(${p.id}, null, this.value)">
                  <option value="Aguardando" ${p.statusPagamento === 'Aguardando' ? 'selected' : ''}>Aguardando</option>
                  <option value="Pago" ${p.statusPagamento === 'Pago' || p.statusPagamento === 'Recebido' ? 'selected' : ''}>Pago</option>
                  <option value="Rejeitado" ${p.statusPagamento === 'Rejeitado' ? 'selected' : ''}>Rejeitado</option>
                </select>
              </td>
              <td>
                <select class="custom-select custom-select-sm" onchange="atualizarStatus(${p.id}, this.value, null)">
                  <option value="Novo" ${p.status === 'Novo' || p.status === 'Recebido' ? 'selected' : ''}>Novo / Recebido</option>
                  <option value="Em Preparo" ${p.status === 'Em Preparo' ? 'selected' : ''}>Em Preparo</option>
                  <option value="Saiu para Entrega" ${p.status === 'Saiu para Entrega' ? 'selected' : ''}>Saiu p/ Entrega</option>
                  <option value="Concluído" ${p.status === 'Concluído' ? 'selected' : ''}>Concluído</option>
                  <option value="Cancelado" ${p.status === 'Cancelado' ? 'selected' : ''}>Cancelado</option>
                </select>
              </td>
              <td>
                <button class="btn btn-sm btn-outline-info rounded-pill" onclick="alert('Endereço de Entrega:\\n${p.enderecoEntrega}')">
                  <i class="bi bi-geo-alt"></i> Ver Endereço
                </button>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error("Erro ao carregar pedidos:", err);
      }
    }

    async function atualizarStatus(id, statusPedido, statusPagamento) {
      await fetch(`${API_URL}/status/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statusPedido, statusPagamento })
      });
      carregarFaturamento();
    }

    function carregarTudo() {
      carregarFaturamento();
      carregarPedidos();
    }

    carregarTudo();
  </script>
</body>
</html>
